<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Dingin ❄️ — Dalang-AI</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="glacier-bg-ambient" aria-hidden="true"></div>

  <main class="calculator-app" role="application" aria-label="Kalkulator Dingin">
    <!-- Header -->
    <header class="calc-header">
      <div class="brand">
        <span class="frost-icon" aria-hidden="true">❄️</span>
        <div class="brand-text">
          <span class="brand-title">KALKULATOR DINGIN</span>
          <span class="brand-sub">Nordic Frost · Dalang-AI</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-toggle-history" class="icon-btn" aria-label="Buka riwayat perhitungan" title="Riwayat (H)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
            <path d="M12 7v5l4 2"/>
          </svg>
          <span id="history-badge" class="badge hidden">0</span>
        </button>
      </div>
    </header>

    <!-- Display Area -->
    <section class="display-panel" aria-live="polite">
      <div class="expression-line" id="calc-expression" aria-label="Ekspresi saat ini"></div>
      <div class="main-line">
        <span class="result-number" id="calc-display" aria-label="Hasil tampilan">0</span>
      </div>
    </section>

    <!-- Keypad Area -->
    <section class="keypad-grid" role="group" aria-label="Tombol Kalkulator">
      <!-- Baris 1: Fungsi Khusus & Bagi -->
      <button class="key key-func" data-action="clear" id="key-clear" aria-label="Hapus semua (Escape)">AC</button>
      <button class="key key-func" data-action="backspace" id="key-backspace" aria-label="Hapus karakter terakhir (Backspace)">⌫</button>
      <button class="key key-func" data-action="negate" id="key-negate" aria-label="Ubah tanda positif negatif">±</button>
      <button class="key key-op" data-action="operator" data-op="÷" id="key-divide" aria-label="Bagi (garis miring)">÷</button>

      <!-- Baris 2: 7, 8, 9, Kali -->
      <button class="key key-num" data-action="number" data-val="7" id="key-7">7</button>
      <button class="key key-num" data-action="number" data-val="8" id="key-8">8</button>
      <button class="key key-num" data-action="number" data-val="9" id="key-9">9</button>
      <button class="key key-op" data-action="operator" data-op="×" id="key-multiply" aria-label="Kali (bintang)">×</button>

      <!-- Baris 3: 4, 5, 6, Kurang -->
      <button class="key key-num" data-action="number" data-val="4" id="key-4">4</button>
      <button class="key key-num" data-action="number" data-val="5" id="key-5">5</button>
      <button class="key key-num" data-action="number" data-val="6" id="key-6">6</button>
      <button class="key key-op" data-action="operator" data-op="−" id="key-subtract" aria-label="Kurang (minus)">−</button>

      <!-- Baris 4: 1, 2, 3, Tambah -->
      <button class="key key-num" data-action="number" data-val="1" id="key-1">1</button>
      <button class="key key-num" data-action="number" data-val="2" id="key-2">2</button>
      <button class="key key-num" data-action="number" data-val="3" id="key-3">3</button>
      <button class="key key-op" data-action="operator" data-op="+" id="key-add" aria-label="Tambah (plus)">+</button>

      <!-- Baris 5: Persen, 0, Titik, Sama Dengan -->
      <button class="key key-func" data-action="percent" id="key-percent" aria-label="Persen (%)">%</button>
      <button class="key key-num" data-action="number" data-val="0" id="key-0">0</button>
      <button class="key key-num" data-action="decimal" id="key-decimal" aria-label="Titik desimal (.)">.</button>
      <button class="key key-equals" data-action="calculate" id="key-equals" aria-label="Sama dengan / Hitung (Enter)">=</button>
    </section>

    <!-- Footer info -->
    <footer class="calc-footer">
      <span>Keyboard Ready · Presisi 28 Digit</span>
    </footer>

    <!-- History Sliding Drawer -->
    <aside class="history-drawer" id="history-drawer" aria-label="Panel Riwayat Perhitungan">
      <div class="history-header">
        <h3>Riwayat Perhitungan</h3>
        <button id="btn-clear-history" class="btn-text-danger" title="Bersihkan riwayat">Hapus Semua</button>
      </div>
      <div class="history-list" id="history-list">
        <div class="history-empty">Belum ada riwayat perhitungan.</div>
      </div>
    </aside>
  </main>

  <script src="calculator.js"></script>
</body>
</html>
