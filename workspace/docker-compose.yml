# =============================================================================
# Dalang-AI Auth Platform — Docker Compose Specification
# =============================================================================
# Usage:
#   1. cp .env.example .env && edit .env
#   2. docker compose up -d --build
#   3. Open frontend: http://localhost (or FRONTEND_PORT)
#   4. Backend API docs: http://localhost:8000/docs
# =============================================================================

services:
  # ─── FastAPI Authentication Backend ──────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: dalang-ai-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-to-a-long-random-secret-at-least-64-chars}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_EXPIRE_MINUTES=${JWT_ACCESS_EXPIRE_MINUTES:-15}
      - JWT_REFRESH_EXPIRE_DAYS=${JWT_REFRESH_EXPIRE_DAYS:-7}
      - JWT_ISSUER=${JWT_ISSUER:-}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-}
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - APP_WORKERS=${APP_WORKERS:-1}
      - APP_LOG_LEVEL=${APP_LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-net

  # ─── Nginx Static Frontend & Reverse Proxy ───────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: dalang-ai-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./frontend_auth:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - app-net

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  app-net:
    driver: bridge
    name: dalang-ai-network
