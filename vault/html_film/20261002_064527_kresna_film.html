<script>
(function(){
'use strict';

// ─── CANVAS SETUP ───────────────────────────────────────────────────────────
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const W = 900, H = 506;

// ─── AUDIO ENGINE ───────────────────────────────────────────────────────────
let audioCtx = null, masterGain = null, soundOn = true;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.35;
  masterGain.connect(audioCtx.destination);
}

function playTone(freq, type, dur, vol=0.5, delay=0, detune=0) {
  if (!soundOn || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  osc.detune.value = detune;
  g.gain.setValueAtTime(0, audioCtx.currentTime + delay);
  g.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + delay + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + dur);
  osc.connect(g); g.connect(masterGain);
  osc.start(audioCtx.currentTime + delay);
  osc.stop(audioCtx.currentTime + delay + dur + 0.05);
}

function playChord(freqs, type, dur, vol=0.3) {
  freqs.forEach((f,i) => playTone(f, type, dur, vol, i*0.03));
}

function playBeatSound(beatIdx) {
  if (!soundOn || !audioCtx) return;
  const patterns = [
    () => { playChord([261,329,392], 'sine', 0.6, 0.25); playTone(523,'sine',0.4,0.2,0.3); },
    () => { playChord([220,277,330], 'triangle', 0.5, 0.2); playTone(440,'triangle',0.3,0.15,0.4); },
    () => { playTone(110,'sawtooth',0.3,0.3); playTone(87,'sawtooth',0.4,0.25,0.1); playTone(146,'square',0.2,0.2,0.25); },
    () => { playChord([349,440,523,698], 'sine', 0.7, 0.2); playTone(1046,'sine',0.5,0.15,0.2); },
    () => { playChord([196,247,294], 'triangle', 0.6, 0.22); playTone(392,'sine',0.4,0.18,0.35); },
    () => { playChord([392,494,587,784], 'sine', 0.8, 0.2); playTone(1174,'sine',0.6,0.15,0.15); },
    () => {
      [261,329,392,523,659,784].forEach((f,i) => playTone(f,'sine',0.5,0.2,i*0.08));
      playChord([523,659,784,1046], 'sine', 0.9, 0.18, 0.6);
    }
  ];
  if (patterns[beatIdx]) patterns[beatIdx]();
}

function playAmbient(beatIdx) {
  if (!soundOn || !audioCtx) return;
  const ambientFreqs = [
    [65,98,130],[73,98,110],[55,73,82],[98,130,164],[65,87,110],[130,164,196],[98,130,164,196]
  ];
  const freqs = ambientFreqs[beatIdx] || [65,98];
  freqs.forEach((f,i) => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = f;
    g.gain.setValueAtTime(0.03, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.015, audioCtx.currentTime + 3);
    g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 4);
    osc.connect(g); g.connect(masterGain);
    osc.start(); osc.stop(audioCtx.currentTime + 4.1);
  });
}

// ─── ANIMATION STATE ────────────────────────────────────────────────────────
let currentBeat = 0;
let isPlaying = true;
let globalT = 0;
let beatT = 0;
let lastTime = null;
let beatDuration = 8000; // ms per beat
let beatProgress = 0;
const TOTAL_BEATS = 7;
let rafId = null;
let transitionAlpha = 0;
let transitioning = false;
let transitionDir = 1;
let pendingBeat = -1;
let particlePool = [];
let dataParticles = [];

// ─── BEAT DATA ───────────────────────────────────────────────────────────────
const beats = [
  {
    id: 1, mood: 'HAPPY', title: 'BEAT 1 — SELAMAT DATANG',
    headline: 'Bismillah... Selamat datang di Dalang-AI Studio!',
    subtitle: '11 Wayang spesialis · 11 ruangan terpisah · satu tujuan: melayani Bos Muda dengan profesional.',
    duration: 9000
  },
  {
    id: 2, mood: 'NEUTRAL', title: 'BEAT 2 — PROTOKOL KOLABORASI',
    headline: 'Bukan freelancer. Tim solid dengan protokol ketat.',
    subtitle: 'Pre-flight Consultation → Eksekusi → Handover Gate → Ren QA → Bagong Vault. Setiap langkah terstruktur.',
    duration: 9000
  },
  {
    id: 3, mood: 'ALERT', title: 'BEAT 3 — DAHULU: ARSITEKTUR LAMA',
    headline: 'DAHULU: Semua berjejal di satu ruangan 3D yang berat!',
    subtitle: 'Three.js monolitik 5.081 baris — shadow map, PBR material, fog — semua sekaligus. GPU 100%, laptop overheat!',
    duration: 9000
  },
  {
    id: 4, mood: 'HAPPY', title: 'BEAT 4 — SEKARANG: BIRD EYE VIEW',
    headline: 'SEKARANG: Bird Eye View — tiap Wayang punya ruangan sendiri!',
    subtitle: 'Canvas 2D 60 FPS — ringan, laptop adem, modular. 11 ruangan: Backend, Frontend, Data, DevOps, Security, QA, Docs, 3D, Screening, Vault, Pantry.',
    duration: 11000
  },
  {
    id: 5, mood: 'NEUTRAL', title: 'BEAT 5 — REN QA GATE',
    headline: 'Ren menjaga pintu Gudang. File cacat tidak lolos!',
    subtitle: 'QA Gate mandatory: HTML valid, canvas ada, audio tersedia, syntax bersih — baru Bagong izinkan masuk Vault.',
    duration: 9000
  },
  {
    id: 6, mood: 'HAPPY', title: 'BEAT 6 — FILM INI SUDAH LULUS QA',
    headline: 'Film ini? Sudah lulus QA Ren & tersimpan di Gudang Bagong!',
    subtitle: 'VLT-XXXXX terdaftar di vault_index.json. Bisa diambil via API atau Telegram kapan pun Bos Muda butuh.',
    duration: 9000
  },
  {
    id: 7, mood: 'HAPPY', title: 'BEAT 7 — RECAP & ROLL CALL',
    headline: 'Risko · Zaki · Lulu · Pingot · Nova · Kai · Ren · Mika · Kresna · Wiku · Bagong — SIAP BERLAKON!',
    subtitle: '📋 RECAP: 11 Karyawan · 11 Ruangan · Pre-flight + Handover + Ren QA + Vault · Dalang-AI Studio Professional.',
    duration: 12000
  }
];

// ─── UTILITY ─────────────────────────────────────────────────────────────────
function lerp(a,b,t){ return a+(b-a)*t; }
function easeOut(t){ return 1-(1-t)*(1-t); }
function easeInOut(t){ return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function sin(t){ return Math.sin(t); }
function cos(t){ return Math.cos(t); }

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}

function rgba(r,g,b,a){ return `rgba(${r|0},${g|0},${b|0},${a})`; }

// ─── PARTICLE SYSTEM ─────────────────────────────────────────────────────────
function spawnParticles(x, y, count, colors, spread=40) {
  for(let i=0;i<count;i++){
    const angle = Math.random()*Math.PI*2;
    const speed = 0.5 + Math.random()*2;
    particlePool.push({
      x, y,
      vx: cos(angle)*speed,
      vy: sin(angle)*speed - 1,
      life: 1, decay: 0.01+Math.random()*0.02,
      size: 2+Math.random()*4,
      color: colors[Math.floor(Math.random()*colors.length)]
    });
  }
}

function updateParticles(dt) {
  for(let i=particlePool.length-1;i>=0;i--){
    const p = particlePool[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.05;
    p.life -= p.decay;
    if(p.life<=0) particlePool.splice(i,1);
  }
}

function drawParticles() {
  particlePool.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size*p.life, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });
}

// ─── BACKGROUND RENDERERS ─────────────────────────────────────────────────────

function drawBg_Beat1(t) {
  // Warm sunrise gradient — welcoming
  const grad = ctx.createRadialGradient(W/2, H*0.4, 0, W/2, H*0.4, W*0.8);
  grad.addColorStop(0, '#1a0a2e');
  grad.addColorStop(0.3, '#0d1b3e');
  grad.addColorStop(0.7, '#0a2240');
  grad.addColorStop(1, '#050810');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // Stars
  ctx.save();
  for(let i=0;i<80;i++){
    const sx = ((i*137.5)%W);
    const sy = ((i*89.3)%H*0.6);
    const pulse = 0.4+0.6*sin(t*0.002+i*0.7);
    ctx.globalAlpha = pulse*0.7;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(sx, sy, 0.8+sin(i)*0.5, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();

  // Golden horizon glow
  const horizGrad = ctx.createLinearGradient(0,H*0.55,0,H);
  horizGrad.addColorStop(0, 'rgba(255,180,50,0.15)');
  horizGrad.addColorStop(0.3, 'rgba(255,120,30,0.08)');
  horizGrad.addColorStop(1, 'rgba(10,10,20,0)');
  ctx.fillStyle = horizGrad;
  ctx.fillRect(0,H*0.55,W,H*0.45);

  // Floating hexagons
  ctx.save();
  for(let i=0;i<8;i++){
    const hx = 100+i*110+sin(t*0.0008+i)*20;
    const hy = H*0.75+cos(t*0.001+i*0.8)*15;
    const hr = 18+i*3;
    ctx.globalAlpha = 0.06+0.04*sin(t*0.001+i);
    ctx.strokeStyle = '#4ecdc4';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for(let j=0;j<6;j++){
      const a = j*Math.PI/3;
      j===0 ? ctx.moveTo(hx+cos(a)*hr, hy+sin(a)*hr) : ctx.lineTo(hx+cos(a)*hr, hy+sin(a)*hr);
    }
    ctx.closePath(); ctx.stroke();
  }
  ctx.restore();
}

function drawBg_Beat2(t) {
  // Clean tech blue-grey — neutral professional
  const grad = ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0, '#0f1923');
  grad.addColorStop(0.5, '#111d2e');
  grad.addColorStop(1, '#0a1520');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // Grid lines
  ctx.save();
  ctx.strokeStyle = 'rgba(100,200,255,0.06)';
  ctx.lineWidth = 1;
  const gridSize = 45;
  for(let x=0;x<W;x+=gridSize){
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
  }
  for(let y=0;y<H;y+=gridSize){
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
  ctx.restore();

  // Flow arrows
  ctx.save();
  const arrowY = H*0.5;
  const steps = ['PRE-FLIGHT','EKSEKUSI','HANDOVER','REN QA','VAULT'];
  const totalW = W*0.75;
  const startX = W*0.12;
  const stepW = totalW/(steps.length-1);
  steps.forEach((s,i) => {
    const ax = startX + i*stepW;
    const pulse = 0.5+0.5*sin(t*0.002-i*0.8);
    ctx.globalAlpha = 0.08+0.05*pulse;
    ctx.fillStyle = '#4ecdc4';
    ctx.beginPath();
    ctx.arc(ax, arrowY+50, 22, 0, Math.PI*2);
    ctx.fill();
    if(i<steps.length-1){
      ctx.globalAlpha = 0.05;
      ctx.strokeStyle = '#64c8ff';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4,4]);
      ctx.beginPath();
      ctx.moveTo(ax+22, arrowY+50);
      ctx.lineTo(ax+stepW-22, arrowY+50);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  });
  ctx.restore();
}

function drawBg_Beat3(t) {
  // Heavy dark red — alert/problem
  const grad = ctx.createRadialGradient(W*0.5,H*0.5,0,W*0.5,H*0.5,W*0.7);
  grad.addColorStop(0, '#1a0505');
  grad.addColorStop(0.4, '#150303');
  grad.addColorStop(1, '#050000');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // Chaotic lines — monolith visual
  ctx.save();
  for(let i=0;i<30;i++){
    const x1 = (sin(t*0.0003+i)*0.5+0.5)*W;
    const y1 = (cos(t*0.0004+i*0.7)*0.5+0.5)*H;
    const x2 = (sin(t*0.0002+i*1.3)*0.5+0.5)*W;
    const y2 = (cos(t*0.0003+i*0.9)*0.5+0.5)*H;
    ctx.globalAlpha = 0.05+0.03*sin(t*0.002+i);
    ctx.strokeStyle = `hsl(${0+i*3},70%,40%)`;
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
    ctx.stroke();
  }
  ctx.restore();

  // Warning stripes
  ctx.save();
  ctx.globalAlpha = 0.04;
  ctx.fillStyle = '#ff4444';
  for(let x=-H;x<W+H;x+=40){
    ctx.save();
    ctx.translate(x,0);
    ctx.rotate(Math.PI/4);
    ctx.fillRect(0,-H,16,H*3);
    ctx.restore();
  }
  ctx.restore();

  // Heat shimmer effect
  const heatGrad = ctx.createLinearGradient(0,H*0.6,0,H);
  heatGrad.addColorStop(0, 'rgba(255,60,0,0.08)');
  heatGrad.addColorStop(1, 'rgba(255,0,0,0)');
  ctx.fillStyle = heatGrad;
  ctx.fillRect(0,H*0.6,W,H*0.4);
}

function drawBg_Beat4(t) {
  // Bright clean teal/green — resolution
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, '#061520');
  grad.addColorStop(0.5, '#082030');
  grad.addColorStop(1, '#041018');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // Dot grid — blueprint style
  ctx.save();
  const dotSpacing = 30;
  for(let x=dotSpacing/2;x<W;x+=dotSpacing){
    for(let y=dotSpacing/2;y<H;y+=dotSpacing){
      const dist = Math.sqrt((x-W/2)**2+(y-H/2)**2);
      const pulse = sin(t*0.001-dist*0.01);
      ctx.globalAlpha = 0.1+0.06*pulse;
      ctx.fillStyle = '#4ecdc4';
      ctx.beginPath();
      ctx.arc(x,y,1.2,0,Math.PI*2);
      ctx.fill();
    }
  }
  ctx.restore();

  // Bright accent glow
  const glow = ctx.createRadialGradient(W*0.5,H*0.5,0,W*0.5,H*0.5,300);
  glow.addColorStop(0, 'rgba(78,205,196,0.06)');
  glow.addColorStop(1, 'rgba(78,205,196,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0,0,W,H);
}

function drawBg_Beat5(t) {
  // Deep purple-blue — QA gate neutral
  const grad = ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0, '#0e0818');
  grad.addColorStop(0.5, '#0c1020');
  grad.addColorStop(1, '#080618');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // Scan lines
  ctx.save();
  for(let y=0;y<H;y+=4){
    ctx.globalAlpha = 0.03;
    ctx.fillStyle = '#8080ff';
    ctx.fillRect(0,y,W,1);
  }
  ctx.restore();

  // Moving scan beam
  const scanY = (t*0.05)%H;
  const scanGrad = ctx.createLinearGradient(0,scanY-30,0,scanY+30);
  scanGrad.addColorStop(0,'rgba(100,120,255,0)');
  scanGrad.addColorStop(0.5,'rgba(100,120,255,0.06)');
  scanGrad.addColorStop(1,'rgba(100,120,255,0)');
  ctx.fillStyle = scanGrad;
  ctx.fillRect(0,scanY-30,W,60);

  // Corner brackets
  ctx.save();
  ctx.strokeStyle = 'rgba(100,200,255,0.12)';
  ctx.lineWidth = 2;
  const bSize = 30;
  [[30,30],[W-30,30],[30,H-30],[W-30,H-30]].forEach(([bx,by]) => {
    const sx = bx<W/2?1:-1, sy = by<H/2?1:-1;
    ctx.beginPath();
    ctx.moveTo(bx,by+sy*bSize); ctx.lineTo(bx,by); ctx.lineTo(bx+sx*bSize,by);
    ctx.stroke();
  });
  ctx.restore();
}

function drawBg_Beat6(t) {
  // Celebratory deep space with gold accents
  const grad = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*0.7);
  grad.addColorStop(0, '#0a1020');
  grad.addColorStop(0.5, '#071015');
  grad.addColorStop(1, '#030508');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // Gold sparkles
  ctx.save();
  for(let i=0;i<50;i++){
    const sx = ((i*173)%W);
    const sy = ((i*97)%H);
    const pulse = sin(t*0.003+i*1.2);
    if(pulse>0.3){
      ctx.globalAlpha = (pulse-0.3)*0.7;
      ctx.fillStyle = i%3===0?'#ffd700':i%3===1?'#4ecdc4':'#64c8ff';
      ctx.beginPath();
      ctx.arc(sx,sy,1+pulse*2,0,Math.PI*2);
      ctx.fill();
    }
  }
  ctx.restore();

  // Vault glow
  const vaultGlow = ctx.createRadialGradient(W*0.75,H*0.5,0,W*0.75,H*0.5,200);
  vaultGlow.addColorStop(0,'rgba(100,200,100,0.08)');
  vaultGlow.addColorStop(1,'rgba(100,200,100,0)');
  ctx.fillStyle = vaultGlow;
  ctx.fillRect(0,0,W,H);
}

function drawBg_Beat7(t) {
  // Grand finale — rich multi-color
